<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff0ea">
<title>Mais Workshop’s</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff0ea;--bg2:#f1ebff;--fg:#25222e;--muted:#5d5869;--glass:rgba(255,255,255,.42);--glass-strong:rgba(255,255,255,.6);--edge:rgba(255,255,255,.85);--shadow:rgba(80,60,120,.18);--b1:#ff8fab;--b2:#ffc94a;--b3:#5fd0cb;--b4:#b5a3e6;--wa:#1faa59;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1b1530;--bg2:#0f1d2e;--fg:#f6f2fb;--muted:#b9b1c8;--glass:rgba(255,255,255,.09);--glass-strong:rgba(255,255,255,.15);--edge:rgba(255,255,255,.25);--shadow:rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#1b1530;--bg2:#0f1d2e;--fg:#f6f2fb;--muted:#b9b1c8;--glass:rgba(255,255,255,.09);--glass-strong:rgba(255,255,255,.15);--edge:rgba(255,255,255,.25);--shadow:rgba(0,0,0,.45);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--fg);font-family:'Heebo','Cairo',Arial,sans-serif;font-size:17px;line-height:1.6;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(50px);opacity:.75;animation:float 16s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:60vmax;height:60vmax;background:var(--b1);top:-15vmax;right:-20vmax}
.blobs i:nth-child(2){width:50vmax;height:50vmax;background:var(--b3);top:45vh;left:-22vmax;animation-delay:-5s}
.blobs i:nth-child(3){width:45vmax;height:45vmax;background:var(--b2);bottom:-15vmax;right:-10vmax;animation-delay:-9s}
.blobs i:nth-child(4){width:35vmax;height:35vmax;background:var(--b4);top:20vh;right:30vw;animation-delay:-2s}
@keyframes float{to{transform:translate(6vmax,-5vmax) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.blobs i{animation:none}html{scroll-behavior:auto}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 16px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--edge);border-radius:28px;box-shadow:0 10px 30px var(--shadow),inset 0 1.5px 0 var(--edge),inset 0 -1px 0 rgba(255,255,255,.12)}
.lang{display:flex;gap:4px;padding:5px;margin:14px auto 0;width:fit-content;border-radius:999px}
.lang button{font:inherit;font-weight:700;font-size:.98rem;color:var(--fg);background:transparent;border:0;border-radius:999px;min-height:44px;min-width:84px;padding:0 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--glass-strong);box-shadow:0 3px 10px var(--shadow),inset 0 1.5px 0 var(--edge)}
.hero{text-align:center;padding:36px 22px 30px;margin-top:16px}
.badge{display:inline-block;padding:6px 16px;border-radius:999px;font-size:.9rem;font-weight:600;background:var(--glass-strong);border:1px solid var(--edge);margin-bottom:14px}
h1{font-size:clamp(1.7rem,7.5vw,2.25rem);line-height:1.2;margin:0 0 12px;font-weight:800}
h1 em{font-style:normal;background:linear-gradient(90deg,#ff7a9c,#ffb02e);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);margin:0 0 24px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 28px;border-radius:999px;background:linear-gradient(180deg,#2fd276,var(--wa));color:#fff;font-weight:800;font-size:1.1rem;text-decoration:none;box-shadow:0 8px 22px rgba(31,170,89,.4),inset 0 1.5px 0 rgba(255,255,255,.55)}
.btn:active{transform:scale(.97)}
section{margin-top:34px}
h2{font-size:1.5rem;font-weight:800;margin:0 4px 14px}
.list{display:grid;gap:12px}
.item{display:flex;gap:14px;align-items:center;padding:16px 18px}
.item .ic{flex:none;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:1.7rem;background:var(--glass-strong);border:1px solid var(--edge);box-shadow:inset 0 1.5px 0 var(--edge)}
.item h3{margin:0;font-size:1.1rem}
.item p{margin:2px 0 0;color:var(--muted);font-size:.95rem;line-height:1.45}
.step .ic{font-weight:800;font-size:1.3rem}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:12px 18px;border-radius:999px;font-weight:600;min-height:48px;display:flex;align-items:center}
.cta{text-align:center;padding:32px 22px}
.cta h2{margin:0 0 8px;font-size:1.6rem}
.cta p{margin:0 0 20px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:26px}
.dock{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock a{pointer-events:auto;max-width:560px;margin:0 auto;border-radius:999px;background:var(--glass-strong);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);border:1px solid var(--edge);box-shadow:0 12px 32px var(--shadow),inset 0 1.5px 0 var(--edge);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px;padding-inline-start:20px;text-decoration:none;color:var(--fg);font-weight:700;min-height:64px}
.dock a .go{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;background:linear-gradient(180deg,#2fd276,var(--wa));color:#fff;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5)}
.dock a:active{transform:scale(.98)}
.logo{display:block;width:min(80%,300px);height:auto;margin:0 auto 12px;filter:drop-shadow(0 8px 14px rgba(150,80,110,.2))}
.about{margin-top:26px;padding:10px}
.about img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:50% 25%;border-radius:22px}
.about p{margin:14px 10px 8px;text-align:center;font-weight:600}
.btn2{margin-top:10px;background:var(--glass-strong);color:var(--fg);border:1px solid var(--edge);box-shadow:0 6px 16px var(--shadow),inset 0 1.5px 0 var(--edge)}
button.btn{width:100%;border:0;font-family:inherit;cursor:pointer}
.book{padding:26px 18px}
.book h2{text-align:center;margin:0 0 6px}
.book .sub{text-align:center;color:var(--muted);margin:0 0 20px}
.f{display:block;margin-bottom:18px}
.f>span{display:block;font-weight:700;margin:0 6px 8px}
.book input,.book textarea{width:100%;min-height:52px;font:inherit;font-size:16px;color:var(--fg);background:var(--glass-strong);border:1px solid var(--edge);border-radius:18px;padding:12px 16px;box-shadow:inset 0 1.5px 0 var(--edge)}
.book input:focus,.book textarea:focus{outline:2px solid var(--b1);outline-offset:1px}
.book textarea{resize:vertical}
.opt{font:inherit;color:var(--fg);cursor:pointer}
.opt[aria-pressed="true"]{background:var(--b1);color:#2a1f2d;border-color:transparent}
.chips.dl{margin-top:10px}
.chip.x{gap:8px}
#status{text-align:center;color:var(--muted);margin:14px 0 0;font-size:.95rem;min-height:1.4em}
#prev{margin-top:10px;display:none}
</style>
</head>
